name: pdh-sandbox
services:
  mysql:
    image: mysql:8.4
    env_file: .env.sandbox
    ports:
      - "127.0.0.1:33319:3306"
    volumes:
      - sandbox_mysql:/var/lib/mysql
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
volumes:
  sandbox_mysql:
