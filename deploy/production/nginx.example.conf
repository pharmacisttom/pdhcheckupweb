# Reference only. Review existing vhost and certificate paths; nginx -t before any authorized reload.
server {
    listen 80;
    server_name pdhcheckup.pluakdaenghospital.cloud;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name pdhcheckup.pluakdaenghospital.cloud;
    ssl_certificate /etc/letsencrypt/live/pdhcheckup.pluakdaenghospital.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pdhcheckup.pluakdaenghospital.cloud/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 3m;
    location / {
        proxy_pass http://127.0.0.1:3036;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
