# Review on the actual authorized host. Do not overwrite existing configuration.
server {
    listen 80;
    server_name REPLACE_WITH_APPROVED_DOMAIN;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
# Add approved TLS settings/certificate before handling any patient information.
