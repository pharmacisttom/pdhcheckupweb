services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pdh_healthcheck
      MYSQL_USER: pdh_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set a unique local database password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a unique root password}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - pdh_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10
volumes:
  pdh_mysql:
